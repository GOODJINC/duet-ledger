name: duet-ledger
services:
  duet-ledger:
    container_name: duet-ledger
    image: ${DUET_LEDGER_IMAGE:-ghcr.io/goodjinc/duet-ledger:0.1.0}
    restart: unless-stopped
    ports:
      - "${DUET_LEDGER_BIND:-127.0.0.1}:${DUET_LEDGER_PORT:-18088}:8080"
    environment:
      DUET_LEDGER_PUBLIC_URL: ${DUET_LEDGER_PUBLIC_URL:-}
      DUET_LEDGER_SECURE_COOKIE: ${DUET_LEDGER_SECURE_COOKIE:-false}
      DUET_LEDGER_DATA_DIR: /data
      DUET_LEDGER_LISTEN: 0.0.0.0:8080
    volumes:
      - duet-ledger-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  duet-ledger-data:
    name: duet-ledger-data
